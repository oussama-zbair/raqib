<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1220"/><stop offset="1" stop-color="#0d1930"/>
    </linearGradient>
    <linearGradient id="og-green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12987C"/><stop offset="1" stop-color="#0E7C66"/>
    </linearGradient>
    <radialGradient id="og-eye" cx="0.5" cy="0.45" r="0.6">
      <stop stop-color="#F8CE6B"/><stop offset="1" stop-color="#F4B740"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="1050" cy="120" r="360" fill="#12987C" opacity="0.08"/>

  <!-- logo star -->
  <g transform="translate(210 315)">
    <g fill="url(#og-green)">
      <rect x="-90" y="-90" width="180" height="180" rx="18"/>
      <rect x="-90" y="-90" width="180" height="180" rx="18" transform="rotate(45)"/>
    </g>
    <path d="M -80 0 C -36 -46, 36 -46, 80 0 C 36 46, -36 46, -80 0 Z" fill="#0B1220"/>
    <path d="M -66 0 C -30 -38, 30 -38, 66 0 C 30 38, -30 38, -66 0 Z" fill="#E8EDF7"/>
    <circle cx="0" cy="0" r="30" fill="url(#og-eye)"/>
    <circle cx="0" cy="0" r="14" fill="#0B1220"/>
    <circle cx="8" cy="-8" r="5" fill="#E8EDF7" opacity="0.9"/>
  </g>

  <text x="380" y="270" font-family="Inter, sans-serif" font-size="86" font-weight="800" fill="#E8EDF7">Raqib <tspan fill="#93a1bd" font-size="54">رقيب</tspan></text>
  <text x="382" y="345" font-family="Inter, sans-serif" font-size="34" font-weight="600" fill="#12987C">Votre veilleur des concours publics</text>
  <text x="382" y="410" font-family="Inter, sans-serif" font-size="26" fill="#93a1bd">Ne manquez plus jamais un concours à déposer.</text>
  <text x="382" y="452" font-family="Inter, sans-serif" font-size="26" fill="#93a1bd">Puis Raqib surveille votre convocation.</text>

  <rect x="382" y="500" width="320" height="6" rx="3" fill="url(#og-green)"/>
</svg>
