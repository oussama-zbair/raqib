name: Publish concours to Telegram channel
# Scrape public-sector sources, keep IT posts, post new ones to the channel, then commit
# state/posted.json back to the repo.
#
on:
  # Paused: the state commit failed on 2026-11-25, re-enable once fixed.
  # schedule:
  #   - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print posts instead of sending them"
        type: boolean
        default: true
concurrency:
  group: publish-channel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Publish
        working-directory: backend
        env:
          # The bot token is a secret. The channel username is public, not a secret.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@RaqibEmploi"
          # Your own Telegram numeric id: the WhatsApp digest is sent to you only.
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          # Optional emergency override of Morocco's UTC offset ("0" or "1"). Leave unset:
          # the job follows the official time zone rules by itself.
          MOROCCO_UTC_OFFSET: ${{ vars.MOROCCO_UTC_OFFSET || secrets.MOROCCO_UTC_OFFSET }}
          # The Cloudflare cron sends dry_run as the string "false", the UI sends a boolean.
          DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
        run: python -m app.jobs.publish_channel $DRY_RUN_FLAG
      - name: Commit posted state
        if: always()
        run: |
          git config user.name "raqib-bot"
          git config user.email "raqib-bot@users.noreply.github.com"
          git add state/posted.json
          git add state/last_run.json state/public.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "chore: update posted state"
          git status --short
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "State committed"
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Posted state could not be pushed. The next run may repost."
          exit 1
