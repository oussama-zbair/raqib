name: Publish concours to Telegram channel
# Scrape public-sector sources, keep IT posts, post new ones to the channel, then commit
# state/posted.json back to the repo.
#
on:
  # Paused: the state commit failed on 2026-11-25, re-enable once fixed.
  # schedule:
  #   - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print posts instead of sending them"
        type: boolean
        default: true
concurrency:
  group: publish-channel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Publish
        working-directory: backend
        env:
          # The bot token is a secret. The channel username is public, not a secret.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@RaqibEmploi"
          DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python -m app.jobs.publish_channel $DRY_RUN_FLAG
      - name: Commit posted state
        if: always()
        run: |
          git config user.name "raqib-bot"
          git config user.email "raqib-bot@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "chore: update posted state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
