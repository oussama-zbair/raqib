name: Ingest concours

# Scrape sources, normalize + dedup, upsert competitions, match profiles, queue digests.
#
# NOTE: the scheduled trigger is disabled until Supabase + secrets are configured.
# Re-enable by uncommenting the `schedule` block once the project is deployed.
on:
  # schedule:
  #   - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: ${{ vars.RAQIB_DEPLOYED == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CIN_ENCRYPTION_KEY: ${{ secrets.CIN_ENCRYPTION_KEY }}
        run: python -m app.jobs.ingest
