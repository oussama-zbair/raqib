name: Probe sources (temporary)
# Checks which job sites answer GitHub's servers. Results go to the "probe" branch only.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx==0.27.2
      - name: Probe
        run: |
          python - <<'EOF'
          import json, httpx
          UA = {"User-Agent": "RaqibBot/0.1 (+https://t.me/RaqibEmploi)"}
          urls = [
            "https://www.emploi-public.ma/ar/",
            "https://www.emploi-public.ma/fr/concours-liste?procedure=0",
            "https://www.wadifa-info.com/",
            "https://www.wadifa-info.com/feed",
            "https://www.interactjob.ma/concours",
            "https://alwadifa.org/",
            "https://alwadifa.org/feed/",
            "https://www.alwadifa-maroc.com/",
            "https://www.9rayti.com/concours",
            "https://www.infotechfouad.com/feeds/posts/default",
            "https://www.tanmia.ma/",
            "https://www.wadifapublic.ma/ar",
            "https://www.dreamjob.ma/feed/",
          ]
          out = {}
          with httpx.Client(headers=UA, timeout=25, follow_redirects=True) as c:
              for u in urls:
                  try:
                      r = c.get(u)
                      out[u] = {"status": r.status_code, "bytes": len(r.content),
                                "type": r.headers.get("content-type", "")[:40],
                                "server": r.headers.get("server", "")[:30],
                                "final": str(r.url)[:120]}
                  except Exception as e:
                      out[u] = {"error": type(e).__name__}
          open("probe.json", "w").write(json.dumps(out, indent=1))
          print(json.dumps(out, indent=1))
          EOF
      - name: Save to probe branch
        run: |
          git config user.name "raqib-bot"
          git config user.email "raqib-bot@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rq --cached .
          git add probe.json
          git commit -qm "probe results"
          git push -f origin probe
