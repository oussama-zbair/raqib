name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        # Failing tests are also printed as annotations, readable on the run page
        # (and through the API) without opening the full log.
        run: |
          set +e
          python -m pytest -q -rf --tb=line 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR)|^/.*:[0-9]+: " pytest.out | head -20 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          exit $status

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run build
